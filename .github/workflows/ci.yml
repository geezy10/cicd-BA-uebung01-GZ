name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on ${{ matrix.os }} with Java ${{ matrix.java-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        java-version: [17, 21]
        exclude:
          - os: windows-latest
            java-version: 21
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven and Run Unit Tests
        run: mvn -B package

      - name: Upload Surefire Test Reports
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.os }}-${{ matrix.java-version }}
          path: target/surefire-reports/

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-${{ matrix.os }}-${{ matrix.java-version }}
          path: target/site/jacoco/jacoco.xml

      - name: SonarCloud Scan
        if: matrix.os == 'ubuntu-latest' && matrix.java-version == '17'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B sonar:sonar


  docker-build-publish:
    name: Docker Build and Publish
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Get short commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ github.repository_owner }}/cicd-ba-uebung01-gz:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save Docker image to a .tar file
        run: docker save ${{ github.repository_owner }}/cicd-ba-uebung01-gz:${{ steps.vars.outputs.sha_short }} --output docker-image-${{ steps.vars.outputs.sha_short }}.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ steps.vars.outputs.sha_short }}
          path: docker-image-${{ steps.vars.outputs.sha_short }}.tar